name: Agente de Mantenimiento Continuo

on:
  push:
    branches: [main]     # <--- ESTO HARÁ QUE CORRA EN CADA PUSH A MAIN
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  mantenimiento:
    name: Auditoria de Mejora Continua
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Agente cagent con Anthropic
        id: auditoria
        uses: docker/cagent-action@main  # <--- Cambiado de @v1 a @main
        with:
          agent: .github/actions/mention-reply/agent-maintainer.yml
          prompt: |
            Realiza una auditoría completa del proyecto.
            Analiza el package.json raíz, los workflows y la estructura general para sugerir optimizaciones.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Crear Issue con Reporte de Auditoría
        if: always() && steps.auditoria.outputs.output-file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ steps.auditoria.outputs.output-file }}
        run: |
          gh issue create \
            --title "🛡️ Reporte de Auditoría Automática - $(date +'%Y-%m-%d')" \
            --body-file "$OUTPUT_FILE"