name: Agente de Mantenimiento Continuo

on:
  schedule:
    - cron: '0 3 * * 0' # Todos los domingos a las 3:00 AM
  workflow_dispatch:     # Permite ejecutarlo manualmente desde Actions

jobs:
  mantenimiento:
    name: Auditoria de Mejora Continua
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Agente cagent con Anthropic
        uses: docker/cagent-action@v1
        with:
          # Ruta exacta donde tienes guardado el YAML de tu agente:
          agent: .github/actions/mention-reply/agent-maintainer.yml
          prompt: |
            Realiza una auditoría completa del proyecto.
            Analiza el package.json raíz, los workflows y la estructura general para sugerir optimizaciones.
          # Usando el secreto tal cual lo registraste en GitHub:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}