name: Agente de Mantenimiento Continuo

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  mantenimiento:
    name: Auditoria de Mejora Continua
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Agente cagent con gemini
        id: auditoria
        uses: docker/cagent-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          agent: .github/actions/agent-maintainer.yaml
          prompt: |
            Realiza una auditoría completa del proyecto.
            Analiza el package.json raíz, los workflows y la estructura general para sugerir optimizaciones.
          google-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Crear Issue con Reporte de Auditoría
        if: always() && steps.auditoria.outputs.output-file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ steps.auditoria.outputs.output-file }}
        run: |
          gh issue create \
            --title "🛡️ Reporte de Auditoría Automática - $(date +'%Y-%m-%d')" \
            --body-file "$OUTPUT_FILE"